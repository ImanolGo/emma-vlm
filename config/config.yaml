# EMMA-VLM configuration. Any value can be overridden from the CLI with
# --set key=value (e.g. --set model.name=openai/gpt-6-luna).

data:
  # nuimages (CAM_FRONT key frames, ~1/6 of samples) or nuscenes (6 cameras/sample).
  dataset: nuimages
  nuimages_root: ${oc.env:NUIMAGES_DATAROOT,data/sets/nuimages}
  nuscenes_root: ${oc.env:NUSCENES_DATAROOT,data/sets/nuscenes}
  version: v1.0-mini
  camera: CAM_FRONT
  history_seconds: 2.0
  future_seconds: 3.0
  dt: 0.5              # waypoint spacing (s); nuImages sweeps are ~2 Hz
  context_frames: 0    # extra past camera frames to send (0 = key frame only)

model:
  api_key: ${oc.env:OPENROUTER_API_KEY,null}
  base_url: https://openrouter.ai/api/v1
  # Default: fast, strong vision + spatial reasoning, structured outputs.
  # Cheaper/faster alternatives: openai/gpt-6-luna, anthropic/claude-haiku-5.5
  name: ${oc.env:EMMA_MODEL,google/gemini-3.8-flash}
  max_tokens: 2048
  temperature: 0.2
  reasoning_effort: low      # low | medium | high | null (omit)
  structured_output: true    # JSON-schema constrained output, falls back automatically
  image_max_side: 1280
  image_quality: 90
  timeout: 90
  max_retries: 3
  parse_retries: 1
  provider: null             # optional OpenRouter provider routing, e.g. {sort: latency}

evaluation:
  concurrency: 4

visualization:
  max_range: 50
  fig_size: [18, 10]
  dpi: 120
  colors:
    trajectory: "#2ecc71"
    gt_trajectory: "#e74c3c"
    baseline: "#95a5a6"
    history: "#34495e"
    vehicle: "#3498db"
    pedestrian: "#f1c40f"
    cyclist: "#9b59b6"
    ego: "#2c3e50"
